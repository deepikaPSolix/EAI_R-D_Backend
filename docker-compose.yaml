services:
  flask-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flask-app
    # restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ./cache:/myapp/cache
      - ./cache/output:/myapp/cache/output
      - ./cache/ml-model:/myapp/cache/ml-model
      - ./cache/uploads:/myapp/cache/uploads
      - ./cache/chroma/db:/myapp/cache/chromadb
      - ./cache/whisper:/root/.cache/whisper
      - ./cache/chroma/models:/root/.cache/chroma
      - ./cache/paddleocr:/root/.paddleocr
      - nltk_data:/usr/share/nltk_data 
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery-worker
    restart: always
    command: celery -A celery_worker.celery worker --loglevel=info
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ./cache:/myapp/cache
      - ./cache/output:/myapp/cache/output
      - ./cache/ml-model:/myapp/cache/ml-model
      - ./cache/uploads:/myapp/cache/uploads
      - ./cache/chroma/db:/myapp/cache/chromadb
      - ./cache/whisper:/root/.cache/whisper
      - ./cache/chroma/models:/root/.cache/chroma
      - ./cache/paddleocr:/root/.paddleocr
      - nltk_data:/usr/share/nltk_data 

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  redis:
    image: "redis"
    container_name: redis
    ports:
      - "6380:6379"
    restart: always


volumes:
  nltk_data: 
