services:
  flask-app:
    build: ./src
    container_name: flask-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ./cache:/app/cache
      - ./cache/ml-model:/app/cache/ml-model
      - ./cache/uploads:/app/cache/uploads
      - ./cache/chromadb:/app/cache/chromadb
      - ./cache/whisper:/root/.cache/whisper
      - ./cache/chromadb/models:/root/.cache/chroma
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  celery-worker:
    build: ./src
    container_name: celery-worker
    restart: always
    command: celery -A server.celery worker --loglevel=info
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ./cache:/app/cache
      - ./cache/output:/app/cache/output
      - ./cache/ml-model:/app/cache/ml-model
      - ./cache/uploads:/app/cache/uploads
      - ./cache/chroma/db:/app/cache/chromadb
      - ./cache/whisper:/root/.cache/whisper
      - ./cache/chroma/models:/root/.cache/chroma

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  redis:
    image: "redis"
    container_name: redis
    ports:
      - "6380:6379"
    restart: always
